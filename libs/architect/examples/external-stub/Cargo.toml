[package]
name = "example-stub-backend"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

# Demonstrator for the THIRD-PARTY extension pattern. Lives outside
# `features/` on purpose — this is what someone implementing
# `ExampleRepo` from outside the project would write.
#
# Hard constraints that make this a believable third-party stand-in:
#  * Depends only on `example-proto` (the contract) and `architect`
#    (for the shared envelope types `RepoError`, `Page`, `Sort`).
#  * Does NOT enable `architect/server`. A real third party would be
#    free to back this with Redis, an HTTP API, a SQLite file via
#    `rusqlite`, anything — no SeaORM constraint.
#  * Does NOT touch `example-db`, `example-memory`, or any other
#    in-tree backend.
#
# In a real consumer the path deps below would be `version = "X.Y"`
# crates.io references. We use paths here because everything lives
# in the same workspace, but the dependency graph is the same shape.

[features]
# On by default: a third-party backend still wants to declare its
# `Services` bundle so consumers can `.into_router()` it like any other.
default = ["vox"]
vox = ["example-proto/vox", "architect/vox"]

[dependencies]
example-proto.workspace = true
architect.workspace = true
tokio = { workspace = true, features = ["sync"] }
uuid.workspace = true
chrono.workspace = true

[lib]
test = false
doctest = false
