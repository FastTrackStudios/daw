[package]
name = "app-server"
version.workspace = true
edition.workspace = true

[package.metadata]

[package.metadata."docs.rs"]
rustdoc-args = ["--html-in-header", "arborium-header.html"]

[lib]
name = "app_server"
path = "src/lib.rs"
test = false
doctest = false

[[bin]]
name = "app-server"
path = "src/main.rs"

# Axum HTTP + vox WebSocket. The actual repository implementation comes
# from the `example` facade, which selects backend by cargo feature.
# Pick exactly one at build time:
#
#   cargo run -p app-server --features backend-db      # default
#   cargo run -p app-server --no-default-features --features backend-memory

[features]
default = ["backend-db"]
# Note both backend features enable `example/server-axum` so the
# axum WebSocket adapter is available regardless of which storage
# backend the binary picks.
backend-db = [
    "example/backend-db",
    "example/server-axum",
    "example/vox",
    "dep:sea-orm",
    "dep:sea-orm-migration",
]
backend-memory = [
    "example/backend-memory",
    "example/server-axum",
    "example/vox",
]
full = ["backend-db", "backend-memory"]

[dependencies]
# The lib (vox_router + ExampleServiceImpl) only needs the contract + the
# vox/axum surface; the backend is chosen by the bin via the features
# below. Generic over the repo, so no backend dep leaks into the lib.
example = { workspace = true, features = ["vox", "server-axum"] }

# The collaborative layer the server hosts: the canonical notes doc
# (`DocSyncHost`) + presence channel, served over the same vox socket.
crdt = { workspace = true, features = ["vox"] }

axum.workspace = true
# `signal` for Ctrl-C graceful shutdown (so the scope's finalizers run);
# `time` for the test-only `LatencyRepo` sleep (EXAMPLE_LATENCY_MS).
tokio = { workspace = true, features = ["signal", "time"] }
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
eyre.workspace = true

# Pulled in only when backend-db is on. We hold a `DatabaseConnection` in
# AppState and run migrations on boot — both are sea-orm specific.
sea-orm = { workspace = true, optional = true }
sea-orm-migration = { workspace = true, optional = true }

uuid.workspace = true
