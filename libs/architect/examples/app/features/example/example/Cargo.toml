[package]
name = "example"
version.workspace = true
edition.workspace = true

# Facade crate for the `example` feature.
#
# Single import root + single feature surface. A consumer picks the
# slice they want via cargo features on this one dep, and gets the
# corresponding pieces re-exported from `example::*`:
#
#   vox            → #[vox::service] surface, dispatcher + client
#   server-seaorm  → architect-emitted ExampleRepoStorage<C> + DbConn
#   server-axum    → architect::axum_ws helpers, re-exported here
#   backend-db     → in-tree SeaORM/SQLite backend (example-db)
#   backend-memory → in-tree HashMap backend (example-memory)
#   full           → all of the above
#
# Both backends implement `example_proto::ExampleRepo`, so dispatcher
# wiring is identical regardless. Third parties skip the facade and
# depend on example-proto + architect directly.

[dependencies]
example-proto.workspace = true
example-db = { workspace = true, optional = true }
example-memory = { workspace = true, optional = true }
example-crdt = { workspace = true, optional = true }
# Optional so consumers who don't need `server-axum` don't pull
# architect's axum + tokio + futures + tracing + vox-core + vox-types.
architect = { workspace = true, optional = true }

[features]
default = []

# ── Axis features (forward to the underlying crates) ──
vox = ["example-proto/vox"]
# Client-only optimistic-store binding (`StoreEntity for Example`). Pulls
# Dioxus via architect-atom — enable only in UI crates.
atom = ["example-proto/atom"]
# Client-only typed form bindings over Create/Update payloads.
form = ["example-proto/form"]
# The collaborative layer: `Note`'s EntityCrdt codec + NoteRepoLoro,
# and (with `atom`) the replica-backed hooks. Wasm-clean.
crdt = ["example-proto/crdt"]
server-seaorm = ["example-proto/server"]
server-axum = ["dep:architect", "architect/server-axum"]

# ── Backend selection ──
backend-db = ["dep:example-db", "example-proto/server"]
backend-memory = ["dep:example-memory"]
# Loro-backed source-of-truth. Pairs with `backend-db` for snapshot
# persistence in production; usable alone for tests/demos.
backend-crdt = ["dep:example-crdt"]

# Adds fake-rs Dummy derives to every wire + emitted struct.
fake = ["example-proto/fake"]

# Forwards to architect/diagnostics — turns moire-web instrumentation
# on for the axum_ws transport adapter. Off by default.
diagnostics = ["dep:architect", "architect/diagnostics"]

# Everything — every axis + every in-tree backend + fake + diagnostics.
# Matches tokio's `full` convention.
full = [
    "vox",
    "crdt",
    "server-seaorm",
    "server-axum",
    "backend-db",
    "backend-memory",
    "backend-crdt",
    "fake",
    "diagnostics",
]

[lib]
test = false
doctest = false
