[package]
name = "example-tests-native"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

# Native integration tests for the `example` feature.
#
# Drives the wire contract from `example-proto` against the in-memory
# backend (`example-memory`) — fast, no WebSocket, no browser. Sister
# crate to `tests/web/`, which runs the same surface from wasm32
# through vox over an actual server.
#
# Run from the repo root:
#   cargo test -p example-tests-native

[dependencies]
example-proto = { workspace = true, features = ["fake"] }
example-memory.workspace = true
example-crdt.workspace = true
crdt.workspace = true
loro.workspace = true
# Pulled in to demonstrate that an external (third-party-shaped)
# backend is interchangeable with the in-tree ones at the trait level.
# See examples/external-stub/.
example-stub-backend.workspace = true
architect = { workspace = true, features = ["fake"] }
fake.workspace = true
uuid.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[lib]
doctest = false
