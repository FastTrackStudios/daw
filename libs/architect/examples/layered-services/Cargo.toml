[package]
name = "example-layered-services"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

# Demonstrator: the `#[architect::rpc]` + `Layer<B>` composition story.
# Shows how a single trait declaration produces a sync trait, an async
# RPC face, and a Layer-composable bundle entry — and how the same
# bundle is wired against different backends or with per-service
# overrides at the call site.
#
# Transport is deliberately out of scope — vox driver / Unix socket /
# axum WS plumbing lives in `examples/custom-server/` and in the
# `daw-bridge` consumer (FastTrackStudio/daw repo). This example is
# the *composition* half of the story.
#
# Run with:
#   cargo run -p example-layered-services

[[bin]]
name = "example-layered-services"
path = "src/main.rs"

[features]
# Enables the architect-rpc-emitted `Service` tokens, `Bind<B>` impls,
# and `<T>Client` aliases. The derive gates these on the *consumer*
# crate's `vox` feature, so this flag is what activates the layer
# composition surface for the rest of the example.
default = ["vox"]
vox = []

[dependencies]
architect = { workspace = true, features = ["vox", "local", "sync-client"] }
vox.workspace = true
facet.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing.workspace = true
tracing-subscriber.workspace = true

# Real entity + two interchangeable backends, to show that a
# `#[derive(Entity)]` repo participates in the layer system exactly like
# the hand-written rpc traits above.
example-proto.workspace = true
example-memory.workspace = true
example-stub-backend.workspace = true
