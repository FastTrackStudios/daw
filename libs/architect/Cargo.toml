[workspace]
members = [
    "examples/app/cli",
    "examples/app/server",
    "examples/app/db",
    "examples/app/tests/e2e",
    "examples/app/features/example/example",
    "examples/app/features/example/example-proto",
    "examples/app/features/example/example-db",
    "examples/app/features/example/example-memory",
    "examples/app/features/example/example-crdt",
    "examples/app/features/example/example-ui",
    "examples/app/features/example/tests/native",
    "crates/architect",
    "features/macros/architect-derive",
    "features/macros/architect-rpc-derive",
    "features/macros/architect-action-derive",
    "examples/external-stub",
    "examples/custom-server",
    "examples/layered-services",
    "features/atom",
    "features/form",
    "features/auth/architect-auth",
    "features/auth/auth",
    "features/auth/auth-proto",
    "features/auth/auth-db",
    "features/auth/auth-client",
    "features/auth/tests/native",
    "apps/architect/cli",
    "features/crdt/crdt",
    "features/crdt/crdt-derive",
    "features/crdt/crdt-seaorm",
    # In `members` (so `cargo xtask` / `cargo run -p xtask` can resolve it)
    # but deliberately left out of `default-members` below — it's a build
    # tool, not part of the production graph.
    "xtask",
]
# Build the production graph by default; xtask is opt-in via `cargo xtask`.
default-members = [
    "examples/app/cli",
    "examples/app/server",
    "examples/app/db",
    "examples/app/tests/e2e",
    "examples/app/features/example/example",
    "examples/app/features/example/example-proto",
    "examples/app/features/example/example-db",
    "examples/app/features/example/example-memory",
    "examples/app/features/example/example-crdt",
    "examples/app/features/example/example-ui",
    "examples/app/features/example/tests/native",
    "crates/architect",
    "features/macros/architect-derive",
    "features/macros/architect-rpc-derive",
    "features/macros/architect-action-derive",
    "examples/external-stub",
    "examples/custom-server",
    "features/atom",
    "features/form",
    "features/auth/architect-auth",
    "features/auth/auth",
    "features/auth/auth-proto",
    "features/auth/auth-db",
    "features/auth/auth-client",
    "features/auth/tests/native",
    "features/crdt/crdt",
    "features/crdt/crdt-derive",
    "features/crdt/crdt-seaorm",
]
# Crates with wasm32 / Dioxus target deps that don't survive a workspace
# host build sit outside; each invokes cargo directly.
exclude = [
    "examples/app/web",
    "examples/app/desktop",
    "examples/app/ui",
    "examples/app/features/example/tests/web",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
authors = ["Cody Wright"]
license = "MIT OR Apache-2.0"
repository = "https://codeberg.org/FastTrackStudios/architect"

[workspace.dependencies]
# Shared async runtime
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Errors
eyre = "0.6"
thiserror = "2"

# Time + IDs
# `wasmbind` makes chrono's clock (`Utc::now()`) work in the browser —
# without it `now()` hits `SystemTime::now()` and panics on wasm32
# ("unreachable executed"). The feature is target-gated, so native builds
# are unaffected. Needed because the optimistic store's `Example::draft`
# stamps a client-side timestamp on wasm.
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "wasmbind"] }
uuid = { version = "1", features = ["v4"] }

# Serialization: vox uses facet for wire encoding.
facet = { version = "0.50.0-rc.5", features = ["reflect", "chrono", "uuid"] }
facet-pretty = "0.50.0-rc.5"

# Test-data + db-seed generation. Architect emits #[derive(Dummy)] on
# every Create/Update/List/Model struct when the `fake` feature is on,
# letting tests + seeding loops generate values deterministically (via
# a seeded RNG) or randomly (default Faker distribution).
fake = { version = "4", features = ["derive", "uuid", "chrono"] }

# CLI argument + config parser. Same shape across xtask, examples/app/cli,
# and any future user-facing binary so flags / env / config files all
# work consistently.
figue = "5.0.0-rc.1"
owo-colors = "4"
heck = "0.5"

# vox — Rust-native RPC. Service traits define the schema; the macro
# emits typed client + dispatcher for every transport.
# Wasm-clean by construction: no transport features, just `runtime`
# (pulls vox-core, gives `#[vox::service]` + the generated `<Trait>Client`
# type). Server crates additionally enable `transport-websocket` if they
# use `vox::serve` — we go through axum directly so we only need this.
# Wasm clients depend on `vox-websocket` directly, not through this dep.
# Pattern lifted from vox's own `rust/wasm-browser-tests` crate.
# v0.8.2-with-Uuid fork. Upstream vox v0.8.2 (230dcd5) panics encoding
# `Uuid` — its postcard encoder has no branch for opaque `Def::Scalar`
# shapes, so every RPC returning a Uuid-bearing entity dies on the wire.
# This fork round-trips Uuid/chrono via display/parse in vox-postcard and
# describes them as `String` in the schema so plan-based/wasm decode
# agrees. The client crates (examples/app/{ui,desktop,tests/web}) pin the
# SAME rev so server + clients share one coherent wire schema.
vox = { version = "0.10.0-rc.5", default-features = false, features = ["runtime"] }
vox-core = "0.10.0-rc.5"
vox-types = "0.10.0-rc.5"
vox-websocket = "0.10.0-rc.5"

# Loro — CRDT engine. Local-first state lives inside a LoroDoc;
# SeaORM stores the doc's snapshot + update log as opaque bytes.
# Wasm-clean: Loro ships first-class WASM.
loro = { version = "1.12", default-features = false }

# Moiré — runtime graph instrumentation. Pinned to our fork at
# codywright/moire which layers (a) forge's NixOS frame-pointer
# termination fix and (b) a flake.nix that builds moire-web with
# its frontend bundled. The `[patch."..."]` block at the bottom
# redirects every transitive bearcove/moire reference (incl. vox's)
# to this same fork so the runtime graph stays coherent.
moire = { git = "https://codeberg.org/FastTrackStudios/moire", rev = "7a2f1dc" }

# Database — SeaORM with SQLite for the reference. Real projects pick
# their own backend without changing the crudcrate-generated traits.
sea-orm = { version = "1", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros", "with-uuid", "with-chrono"] }
sea-orm-migration = { version = "1", features = ["sqlx-sqlite", "runtime-tokio-rustls"] }

# HTTP
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
wasm-bindgen-futures = "0.4"

# The architect derive crate — owns the macro that emits the wire
# struct + the SeaORM Model + the auto-generated vox repo trait,
# all from one source struct. Every entity crate depends on this.
architect = { path = "crates/architect" }

# Client-side optimistic / stale-while-revalidate state for Dioxus —
# the client twin of the server-side Layer/Resource DI. Entity-agnostic
# and wasm-safe (Dioxus core only). Pulled by the UI crates, never the
# server.
architect-atom = { path = "features/atom" }

# Typed, validated form state for Dioxus (effect-form analog). Builds on
# architect-atom (submit result is an `AtomResult`). Wasm-safe; UI-only.
architect-form = { path = "features/form" }

# ── Auth feature (folded in from FastTrackStudios/architect-auth) ──────
#
# Unlike atom/form (primitives *below* the architect crate), auth is built
# *on* architect — auth-proto uses the Entity derive, the engine mounts on
# vox/axum — so there's no `architect::auth` re-export (it would be a
# dependency cycle). Consumers depend on `architect-auth` directly; it
# re-exports the engine, `proto`, and (under `db`) the SeaORM storage.
architect-auth = { path = "features/auth/architect-auth" }
auth = { path = "features/auth/auth" }
auth-proto = { path = "features/auth/auth-proto" }
auth-db = { path = "features/auth/auth-db" }
auth-client = { path = "features/auth/auth-client" }

# Auth's crypto + token stack.
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.10"
cookie = "0.18"
hkdf = "0.12"
jsonwebtoken = "9"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
totp-rs = { version = "5", features = ["gen_secret", "otpauth"] }
# Property tests for the auth boundary (dev-dependency).
proptest = "1"

# Proto crate — referenced by everything else as a path dep so
# entity changes flow uniformly to every surface.
example = { path = "examples/app/features/example/example" }
example-proto = { path = "examples/app/features/example/example-proto" }
example-db = { path = "examples/app/features/example/example-db" }
example-memory = { path = "examples/app/features/example/example-memory" }
example-crdt = { path = "examples/app/features/example/example-crdt" }
example-stub-backend = { path = "examples/external-stub" }

# Local-first CRDT layer — generic LoroDoc wrapper, EntityCrdt trait,
# Persistence trait. Backend-agnostic: pair with crdt-seaorm on the
# server, with crdt-indexeddb (future) in the browser, or run with the
# bundled in-memory persistence for tests.
crdt = { path = "features/crdt/crdt" }

# Object-safe async traits (Persistence). Hot-path traits in this
# workspace use Rust 2024 async-fn-in-trait via #[vox::service]; we
# only reach for async-trait where dyn-dispatch is needed.
async-trait = "0.1"

# Redirect every transitive bearcove/moire reference (e.g. vox's
# moire-runtime / moire-tokio / moire-types) to our fork at the same
# rev as the workspace dep above. Without this, vox + architect would
# end up with two parallel moire compilations, two parallel entity
# graphs, and the dashboard would see only half the picture.
[patch."https://github.com/bearcove/moire"]
moire             = { git = "https://codeberg.org/FastTrackStudios/moire", rev = "7a2f1dc" }
moire-macros      = { git = "https://codeberg.org/FastTrackStudios/moire", rev = "7a2f1dc" }
moire-macros-noop = { git = "https://codeberg.org/FastTrackStudios/moire", rev = "7a2f1dc" }
moire-runtime     = { git = "https://codeberg.org/FastTrackStudios/moire", rev = "7a2f1dc" }
moire-tokio       = { git = "https://codeberg.org/FastTrackStudios/moire", rev = "7a2f1dc" }
moire-trace-capture = { git = "https://codeberg.org/FastTrackStudios/moire", rev = "7a2f1dc" }
moire-trace-types = { git = "https://codeberg.org/FastTrackStudios/moire", rev = "7a2f1dc" }
moire-types       = { git = "https://codeberg.org/FastTrackStudios/moire", rev = "7a2f1dc" }
moire-wasm        = { git = "https://codeberg.org/FastTrackStudios/moire", rev = "7a2f1dc" }
moire-wire        = { git = "https://codeberg.org/FastTrackStudios/moire", rev = "7a2f1dc" }
