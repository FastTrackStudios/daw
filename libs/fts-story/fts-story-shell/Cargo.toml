[package]
name = "fts-story-shell"
version.workspace = true
edition = "2021"          # kept on 2021 — pre-move workspace edition; migrate deliberately
license.workspace = true
repository.workspace = true
description = "Interactive Lookbook-style shell for fts-story."

[dependencies]
fts-story-core    = { workspace = true }
fts-story-runtime = { workspace = true }
# `router` feature enables `Router`, `Routable`, `use_navigator`, etc. —
# the shell uses this for URL-based component selection so that
# refresh / share-link / back-button preserve the selected component.
dioxus = { workspace = true, features = ["router"] }

[lints]
workspace = true
