# Vendored phon 0.2.0-rc.5 (facet-rs/facet) with ONE addition: derive
# support for parse/display opaque scalars (Uuid, chrono DateTime/NaiveDate,
# url, ulid, …) — upstream rc.5 panics ("cannot derive phon from this
# type") the first time such a field is encoded, which aborted task-server
# on every issue/project list reply. Drop the vendor once upstream derives
# these (see src/derive.rs `display_scalar_descriptor`).
[package]
name = "phon"
version = "0.2.0-rc.5"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/facet-rs/facet"
description = "The phon front door: facet-derived schemas and descriptors, typed encode/decode, optional JIT."

[features]
default = []
# Pull in the copy-and-patch JIT and route the typed API through it. Off by
# default so the baseline interpreter pays nothing; not enabled on targets that
# forbid allocating executable memory. (r[crates.jit-opt-in])
jit = ["dep:phon-jit"]

[dependencies]
phon-schema = "=0.2.0-rc.5"
phon-ir = "=0.2.0-rc.5"
phon-engine = "=0.2.0-rc.5"
phon-jit = { version = "=0.2.0-rc.5", optional = true }
facet = "0.50.0-rc.5"
facet-value = "0.50.0-rc.5"
