[dependencies]

[dev-dependencies.cpal]
version = "0.17.3"

[dev-dependencies.crossterm]
version = "^0.29.0"

[build-dependencies.bindgen]
version = "^0.72.1"
# default-features=false + experimental+runtime (matching libspa-sys's own
# request): plain "default" unified with libspa-sys's "experimental"+
# "runtime" breaks bindgen's macro constant-folding for cast-expression C
# macros (e.g. SPA_ID_INVALID = ((uint32_t)0xffffffff)) — bindgen silently
# drops the constant instead of erroring, surfacing later as a confusing
# "cannot find value SPA_ID_INVALID" at the libspa Rust call site. Cargo
# feature-unifies build-dependencies workspace-wide (resolver "3" still
# unifies within one build's target set, and fasttrackstudio/signal-plugin
# pull in both rusty_link, via daw-link's Ableton Link sync, and
# libspa-sys, via cpal's pipewire backend) — so upstream rusty_link's plain
# `bindgen = "^0.72.1"` (implicit default features) collides with
# libspa-sys's explicit `default-features = false, features = ["experimental",
# "runtime"]`. Matching the same explicit set here removes the conflict.
default-features = false
features = ["experimental", "runtime"]

[build-dependencies.cmake]
version = "^0.1.58"
