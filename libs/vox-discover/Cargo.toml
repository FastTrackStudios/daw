[package]
name = "vox-discover"
version = "0.1.0"
edition.workspace = true
description = "mDNS service discovery for vox RPC services"

[dependencies]
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "rt"] }
tracing = "0.1"
zeroconf = "0.15"

[dev-dependencies]
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
