[workspace]
members = ["crates/monarchy", "crates/monarchy-derive"]
resolver = "2"

[workspace.lints.rust]
dead_code = "allow"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["FastTrack Studio"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Facet ecosystem — 0.50 line (facet 0.50 / vox 0.10 migration)
facet = { version = "0.50.0-rc.1" }

# Common dependencies
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"

# Proc-macro dependencies
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"

# Internal crates
monarchy = { path = "crates/monarchy" }
monarchy_derive = { path = "crates/monarchy-derive" }
