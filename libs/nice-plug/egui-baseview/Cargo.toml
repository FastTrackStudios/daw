[package]
name = "egui-baseview"
version = "0.2.2"
edition.workspace = true
rust-version.workspace = true
authors = ["Robbert van der Helm <mail@robbertvanderhelm.nl>", "Billy Messenger <billydm@noreply.codeberg.org>"]
repository = "https://codeberg.org/BillyDM/nice-plug"
license = "MIT OR Apache-2.0"
description = "A baseview backend for egui"
keywords = ["gui", "nice-plug", "plugin", "clap", "vst3"]
categories = ["gui"]
readme = "README.md"

[features]
default = ["opengl", "tracing"]
opengl = ["dep:egui_glow", "baseview/opengl"]
wgpu = ["dep:egui-wgpu", "dep:raw-window-handle-06", "dep:pollster", "dep:wgpu"]
## Enables a temporary workaround for keyboard input not working sometimes.
## See https://github.com/BillyDM/egui-baseview/issues/20
keyboard_focus_workaround = []
## Enables logging using nice-plug's logging feature
nice-log = ["dep:nice-plug-core"]
## Enable this if `nice-log` is disabled
tracing = ["dep:tracing"]

[dependencies]
baseview.workspace = true
raw-window-handle.workspace = true
egui.workspace = true
egui_glow = { version = "0.34.1", features = ["x11"], optional = true }
egui-wgpu = { version = "0.34.1", features = ["x11"], optional = true }
wgpu = { version = "29", optional = true }
keyboard-types = { version = "0.6", default-features = false }
raw-window-handle-06 = { package = "raw-window-handle", version = "0.6", optional = true }
copypasta = { version = "0.10", default-features = false, features = ["x11"] }
nice-plug-core = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
open.workspace = true
pollster = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
egui = { version = "0.34.1", features = ["default_fonts"] }
baseview = { workspace = true, features = ["opengl"] }
