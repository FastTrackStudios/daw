[package]
name = "nice-log"
version = "0.2.2"
edition.workspace = true
rust-version.workspace = true
authors = ["Robbert van der Helm <mail@robbertvanderhelm.nl>", "Billy Messenger <billydm@noreply.codeberg.org>"]
license = "ISC"
repository = "https://codeberg.org/BillyDM/nice-plug"
description = "An opinionated yet flexible logger catering to the needs of the nice-plug plugin framework"
keywords = ["log", "logging", "nice-plug"]

[dependencies]
atty = "0.2.14"
log = "0.4.29"
once_cell = "1.21"
termcolor = "1.4"
time = { version = "0.3.47", features = ["formatting", "local-offset", "macros"] }

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.44"
features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_Debug",
]
