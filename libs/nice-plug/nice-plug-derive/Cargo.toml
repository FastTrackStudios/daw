[package]
name = "nice-plug-derive"
version = "0.1.1"
edition.workspace = true
license = "ISC"
authors = ["Robbert van der Helm <mail@robbertvanderhelm.nl>", "Billy Messenger <billydm@noreply.codeberg.org>"]
repository = "https://codeberg.org/BillyDM/nice-plug"
description = "Proc macros for the nice-plug framework"
keywords = ["audio", "plugin", "vst", "vst3"]

[lib]
proc-macro = true

[dependencies]
syn = { version = "1.0", features = ["extra-traits"] }
