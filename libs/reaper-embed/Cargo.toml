[package]
name = "reaper-embed"
version = "0.1.0"
edition = "2024"
description = "Transparent overlay windows with Vello rendering for REAPER extensions"

[dependencies]
wgpu = { version = "27", features = ["wgsl"] }
vello = { version = "0.7", features = ["wgpu"] }
skrifa = "0.40"
pollster = "0.4"
raw-window-handle = "0.6"
tracing = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2.7"

[lints.rust]
unsafe_code = "allow"
