[workspace]
resolver = "2"
members = [
    "crates/editor-state",
    "crates/editor-syntax",
    "crates/editor-view",
    "crates/editor-vim",
    "crates/editor-typst",
    "crates/editor-mermaid",
    "crates/editor-keyflow",
    "crates/editor-keyflow-lang",
    "crates/editor",
    "crates/editor-crdt",
    "crates/editor-lsp",
    "examples/playground",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Cody Wright <acodywright@gmail.com>"]
repository = ""
rust-version = "1.90"

[workspace.dependencies]
# Internal
editor-state = { path = "crates/editor-state" }
editor-syntax = { path = "crates/editor-syntax" }
editor-view = { path = "crates/editor-view" }
editor-vim = { path = "crates/editor-vim" }
editor-typst = { path = "crates/editor-typst" }
editor-mermaid = { path = "crates/editor-mermaid" }
editor-keyflow = { path = "crates/editor-keyflow" }
editor-keyflow-lang = { path = "crates/editor-keyflow-lang" }
editor = { path = "crates/editor" }
editor-crdt = { path = "crates/editor-crdt" }

# Keyflow — the editor's `.kf` fence renderer (`editor-keyflow`) drives the
# engraver's CPU-only `svg` tier; `editor-keyflow-lang` drives the text
# highlighter + IDE diagnostics through the `keyflow` facade. Both reach into
# the sibling keyflow checkout. Editor and keyflow live under
# `~/Development/{Editor,FastTrackStudio/keyflow}`, so this relative path
# matches what Task uses for engraver today.
engraver = { git = "https://codeberg.org/FastTrackStudios/keyflow.git", branch = "main", default-features = false }
# `editor-keyflow-lang` depends on keyflow-text DIRECTLY (not the `keyflow`
# facade) on purpose: the facade hard-deps `daw-module`, which pulls full
# tokio (net) and can't build for wasm32. keyflow-text only needs
# keyflow-proto + keyflow-syntax, so the highlighter/IDE path stays
# wasm-friendly. `highlighting` exposes `keyflow_text::highlighting::*`.
keyflow-text = { git = "https://codeberg.org/FastTrackStudios/keyflow.git", branch = "main", default-features = false, features = ["highlighting"] }

# UI
dioxus = { version = "0.7.9", default-features = false, features = ["lib"] }

# Syntax highlighting (tree-sitter via Arborium)
arborium = { version = "2.16.0", default-features = false }
arborium-theme = "2.16.0"
arborium-tree-sitter = "2.16.0"

# Doc model
ropey = "1.6"

# General
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0"

# Logging — tracing is the structured-logs / spans facade we use
# everywhere; subscriber + appender are wired in the playground
# (and any future binary) to fan out to stdout + a logfile.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

# Locally vendored fork of `mermaid-rs-renderer` 0.2.2 with
# `std::time::Instant` swapped for `web_time::Instant` so the
# layouter doesn't panic on `wasm32-unknown-unknown`. See
# `vendor/mermaid-rs-renderer/` for the patch.
#
# NOTE: `[patch]` only applies from the workspace that is the *build root*.
# When Task or keyflow depend on these crates as path dependencies, THEY are
# the build root and this patch is ignored — each consumer must carry the same
# `mermaid-rs-renderer` patch pointing at this `vendor/` directory.
[patch.crates-io]
mermaid-rs-renderer = { path = "vendor/mermaid-rs-renderer" }

[workspace.lints.clippy]
# Default-level (correctness / suspicious / style / complexity / perf) runs
# under `-D warnings` already. Pedantic adds another ~150 lints aimed at
# idiomatic Rust. We opt in workspace-wide at deny level; the allows below are
# scoped pedantic carve-outs where the lint is high-volume and low-signal.
pedantic = { level = "deny", priority = -1 }

missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"
too_many_lines = "allow"
module_name_repetitions = "allow"
similar_names = "allow"
unsafe_derive_deserialize = "allow"
manual_let_else = "allow"
redundant_closure_for_method_calls = "allow"
default_trait_access = "allow"
format_push_string = "allow"
unnecessary_wraps = "allow"
struct_excessive_bools = "allow"
unused_async = "allow"
redundant_closure = "allow"
assigning_clones = "allow"
items_after_statements = "allow"
match_same_arms = "allow"
needless_pass_by_value = "allow"
trivially_copy_pass_by_ref = "allow"
unused_self = "allow"
needless_continue = "allow"

[profile.dev]
opt-level = 1
debug = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
