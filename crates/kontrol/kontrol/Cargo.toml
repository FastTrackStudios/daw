[package]
name = "kontrol"
version.workspace = true
edition = "2021"
authors.workspace = true
license.workspace = true
description = "Native Instruments Komplete Kontrol keyboard driver — MIDI output helpers and Light Guide (per-key RGB LED) control on Linux. Native-only hardware I/O; speaks midicore MidiEvent types over a midir output port."

[dependencies]
# Types only (MidiEvent + newtypes + byte codec). Root pins this with
# default-features = false, so no `vox`/`midir` surface is dragged in — we
# talk to the OS via `midir` directly (MIDI OUTPUT, which midicore-midir does
# not expose today).
midicore.workspace = true
# OS MIDI backend for OUTPUT. Same version the root workspace pins (0.11), so
# only one midir / alsa-sys shows up in this crate's dependency graph. We keep
# the default ALSA backend here (the driver crate is a standalone probe, not
# part of the pipewire live-rig binary); pipewire hosts still see the ALSA-seq
# ports via the pipewire ALSA-seq bridge.
midir.workspace = true
# The Light Guide is a HID output report (report 0x82 on the MK3's HID
# interface), NOT bulk USB or MIDI — CONFIRMED on an S88 MK3, see
# docs/protocol.md. hidapi (hidraw on Linux) is the path to the LEDs; it
# coexists with the kernel usbhid/audio drivers so MIDI is undisturbed. The
# midir dep above is for the future NIHIA DAW-port integration.
hidapi.workspace = true
# Raw USB bulk — the two color SCREENS are driven by bulk transfer on the
# vendor interface (endpoint 0x04), a separate path from the HID Light Guide.
rusb.workspace = true
eyre.workspace = true
tracing.workspace = true

[features]
default = []
