<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ config.title }}{% endblock %}</title>
    {% if config.description %}<meta name="description" content="{{ config.description }}">{% endif %}
    <link rel="stylesheet" href="{{ get_url(path='css/style.css') }}">
</head>
<body>
    <header class="site-header">
        <a href="/" class="site-title">{{ config.title }}</a>
        <nav>
            <a href="/getting-started/">Getting started</a>
            <a href="/architecture/">Architecture</a>
            <a href="/reference/">Reference</a>
            <a href="https://git.starcommand.live/codywright/architect">Repo</a>
        </nav>
    </header>
    <main class="content">
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
        <p>Built with <a href="https://github.com/bearcove/dodeca">dodeca</a>.</p>
    </footer>
</body>
</html>
