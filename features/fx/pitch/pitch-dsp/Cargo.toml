[package]
name = "pitch-dsp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
audiocore-dsp = { workspace = true }
serde = { workspace = true }

# External pitch/time-stretch libraries
signalsmith-stretch = "0.1"

[dev-dependencies]
criterion = "0.5"
hound = "3.5"
rustfft = "6.2"

[[bench]]
name = "throughput"
harness = false

[[bench]]
name = "quality"
harness = false


[features]
default = []
# Links the system `rubberband` library (Rubber Band Library FFI).
# Off by default so the workspace builds without the system dep;
# Algorithm::Rubberband falls back to Signalsmith when disabled.
rubberband = []
