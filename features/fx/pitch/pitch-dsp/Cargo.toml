[package]
name = "pitch-dsp"
version.workspace = true
edition = "2021"          # kept on 2021 — pre-move signal workspace edition; migrate deliberately
authors.workspace = true
license.workspace = true

[dependencies]
audiocore-dsp = { workspace = true }
serde = { workspace = true }

# External pitch/time-stretch libraries (C++ via cc — native only; the
# `signalsmith` feature keeps it off the wasm/embedded build graph).
signalsmith-stretch = { version = "0.1", optional = true }

[dev-dependencies]
criterion = "0.5"
hound = "3.5"
rustfft = "6.2"

[[bench]]
name = "throughput"
harness = false

[[bench]]
name = "quality"
harness = false


[features]
default = ["signalsmith"]
# The Signalsmith Stretch shifter + the `chain` module (PitchChain /
# Algorithm) that hard-requires it. C++ via cc, so it cannot build for
# wasm32-unknown-unknown — the pure-Rust modules (granular / wsola /
# psola / pll / pog / divider / allpass_shift) stay available without it
# via `default-features = false`.
signalsmith = ["dep:signalsmith-stretch"]
# Links the system `rubberband` library (Rubber Band Library FFI).
# Off by default so the workspace builds without the system dep;
# Algorithm::Rubberband falls back to Signalsmith when disabled.
rubberband = ["signalsmith"]
