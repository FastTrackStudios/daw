[package]
name = "fts-launcher"
version.workspace = true
edition.workspace = true
license = "MIT"
description = "FastTrackStudios launcher for Reaper — audio production workflow launcher"
repository = "https://codeberg.org/FastTrackStudios/fts-launcher"

[lib]
name = "fts_launcher"
path = "src/lib.rs"

[[bin]]
name = "fts-launcher-standalone"
path = "src/main.rs"
required-features = ["standalone"]

[features]
default = ["native"]
native = ["daw/reaper-ui"]
desktop = []
standalone = ["native", "dep:winit", "dep:tracing-subscriber"]

[dependencies]
# Core launcher engine and UI. STILL GIT DEPS on dioxus-launcher.git —
# the launcher-core/launcher-ui/providers crates live in that repo and
# are not vendored yet (flagged in HANDOFF; note launcher-ui carries its
# own git fts-ui, a second fts-ui instance beside the in-tree one).
launcher-core = { git = "https://codeberg.org/FastTrackStudios/dioxus-launcher.git", branch = "main" }
launcher-ui = { git = "https://codeberg.org/FastTrackStudios/dioxus-launcher.git", branch = "main", default-features = false }
providers = { git = "https://codeberg.org/FastTrackStudios/dioxus-launcher.git", branch = "main" }
fts-ui = { workspace = true }

# Dioxus native renderer (Blitz) — workspace-pinned rev (one blitz tree-wide)
dioxus-native = { workspace = true }

# DAW API (safe Rust, async, generic)
daw = { workspace = true }
reaper-high = { workspace = true }
reaper-medium = { workspace = true }

# Standalone binary deps (optional)
winit = { version = "=0.31.0-beta.2", optional = true }
tracing-subscriber = { workspace = true, optional = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
facet = { workspace = true }
facet-styx = { workspace = true }

# Logging
tracing = { workspace = true }

[lints]
workspace = true
