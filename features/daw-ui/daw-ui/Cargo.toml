[package]
name = "daw-ui"
description = "DAW UI — Dioxus components for DAW integration (mixer, TCP, arrangement, FX browser)"
version.workspace = true
edition.workspace = true

[package.metadata]

[package.metadata."docs.rs"]
rustdoc-args = ["--html-in-header", "arborium-header.html"]

[dependencies]
daw-control = { workspace = true }
daw-proto = { workspace = true }
dock-dioxus = { workspace = true, default-features = false }
dock-proto = { workspace = true }
eyre = { workspace = true }

# UI framework (conditional on feature)
dioxus = { workspace = true, optional = true }
dioxus-native = { workspace = true, optional = true }

# Logging
tracing = { workspace = true, optional = true }

tokio = { version = "1", features = ["time"] }

# Optional deps for the `reaper-test-panels` feature — the FTS UI demo
# panels (Native + Desktop renderer toggles) shipped from this crate so any
# extension can mount them without reimplementing the wiring.
daw-module = { workspace = true, optional = true }
daw-reaper-dioxus = { workspace = true, optional = true }
fts-ui = { workspace = true, optional = true }

# REAPER theme importer (`reaper-theme` feature): maps a .ReaperTheme palette
# + rtconfig params onto our Theme tokens.
daw-theme-reaper = { workspace = true, optional = true }

[features]
default = ["web"]
web = ["dep:dioxus", "dep:tracing", "dock-dioxus/web"]
native = ["dep:dioxus-native"]
# Folder-hierarchy mixer (`widgets::mixer::Mixer`, driven by
# `daw_proto::track::FolderDepthChange`). daw-proto is already a hard dep.
hierarchy = ["web"]
# Import REAPER themes (palette/params → Theme; see theming::reaper_import).
reaper-theme = ["dep:daw-theme-reaper"]
# Ships the `FTS_UI_NATIVE` and `FTS_UI_DESKTOP` panel + action defs that
# render `fts_ui::showcase::Showcase` through the daw-reaper-dioxus host.
reaper-test-panels = [
    "web",
    "dep:daw-module",
    "dep:daw-reaper-dioxus",
    "dep:fts-ui",
]
# The `playground` example: the vector-themeable panels driven by fake
# sample data (no DAW backend), served in the browser via `dx serve`.
# Pulls the dioxus WEB RENDERER (the base `web` feature only enables the
# dioxus dep for rsx, not a renderer).
playground = ["web", "dioxus/web", "dioxus/launch"]

# Web-build helpers for the widgets (e.g. knob pointer-lock / coords).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
# `Location` is needed by the dioxus-web renderer's history module (its own
# fork Cargo declares `History` but not `Location`, and relies on the
# downstream crate to enable it — the fasttrackstudio app does the same).
# web-sys features are additive across the graph, so this is harmless for
# non-web-renderer builds.
web-sys = { version = "0.3", features = ["Window", "Document", "MouseEvent", "EventTarget", "Location"] }

# The browser playground for the DAW panels — `dx serve --example
# playground --platform web --features playground`.
[[example]]
name = "playground"
required-features = ["playground"]

[lints]
workspace = true
