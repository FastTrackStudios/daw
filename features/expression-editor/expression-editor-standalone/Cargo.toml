[package]
name = "expression-editor-standalone"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
description = "The expression editor as a standalone desktop runner over daw-standalone — a real window on a project or fixture, one `cargo run --example` away"

[dependencies]
expression-editor-core = { workspace = true }
expression-editor-daw = { workspace = true }
# `daw` because the audio session drives the facade; `render` because a
# pitch edit has to be able to produce audio for the write path the
# REAPER module already has.
expression-editor-audio = { workspace = true, features = ["daw", "render"] }
expression-editor-ui = { workspace = true }
expression-editor-guitarpro = { workspace = true }
# `standalone-rpp` = the standalone backend + the `.rpp` loader + source
# decoding, which is what makes an audio take analysable with no DAW.
daw = { workspace = true, features = ["standalone-rpp", "standalone-save"] }
dioxus = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# The window. A dev-dependency rather than a dependency: the library
# half is the *loading*, which is portable and testable, and pulling
# Blitz/vello/wgpu into it would make every consumer pay for a window
# they may not open. Examples get dev-dependencies, so `--example
# editor` still links it.
#
# The window, for both `--example editor` and `--example serve`.
# dioxus's own desktop path: Blitz -> Vello -> winit.
#
# This used to be `nice-plug-dioxus`, which opens a *plugin editor*
# window through baseview. The expression editor is an application, not
# a VST3/CLAP plugin, and carrying a plugin framework to open an app
# window bought a second windowing path and a second renderer to keep in
# parity with, for nothing this crate needs.
dioxus-native = { workspace = true }
# The CPU rasterizer behind `--example shot`.
dioxus-test = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "time"] }
# Tests build their `.rpp` fixture with the same writer the loader
# reads, so they test our loading rather than a hand-typed file.
dawfile-reaper = { workspace = true }
