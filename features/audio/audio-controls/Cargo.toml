[package]
name = "audio-controls"
description = "Professional audio parameter control widgets for Dioxus"
version.workspace = true
edition.workspace = true

[dependencies]
# UI framework
dioxus = { workspace = true, optional = true }

# Track-hierarchy types for the `Mixer` (behind the `hierarchy` feature) — lets
# the mixer consume the daw's relative folder-depth model directly.
daw-proto = { path = "../../../crates/daw-proto", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Document", "MouseEvent", "EventTarget"] }

[features]
default = ["web"]
web = ["dep:dioxus"]
# Enables the `Mixer` component driven by `daw_proto::track::FolderDepthChange`.
hierarchy = ["web", "dep:daw-proto"]

[lints]
workspace = true
